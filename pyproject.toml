[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hello-cimd"
version = "0.1.0"
description = "MCP hello world server with say_hello tool, implementing server-side CIMD (Client ID Metadata Documents)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mcp[cli]>=1.2.0",
    "cryptography==41.0.7",
    "requests==2.31.0",
    "pyjwt>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mcp-hello-cimd = "mcp_hello_cimd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
